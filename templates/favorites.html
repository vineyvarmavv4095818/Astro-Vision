{% extends "base.html" %}

{% block content %}

    <!DOCTYPE html>
<html>
<head>
    <title>My Favorites</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='fav.css') }}">
</head>
<body>
    <div class="main-fav">
    <h1>
        <i class="fa-regular fa-star" style="color: yellow;" ></i>
        MY FAVORITE APODs</h1>

    <div class="grid-fav">
        {% for item in favorites %}

    <div class="favorite-card">

        <h3>{{ item.title }}</h3>
        
        {% if item.media_type == "image" %}
            <img src="{{ item.image_url }}">

        {% else %}

        <iframe
            src="{{ item.image_url }}"
            width="500"
            height="300"
            allowfullscreen>
        </iframe>

        {% endif %}

        <div class="content">

            <a href="/delete_favorite/{{ item.date }}">
                <button class="delete-btn">
                    <i class="fa-solid fa-trash-can"></i>
                    Remove
                </button>
            </a>
        </div>

    </div>

        {% endfor %}
    </div>
    </div>
</body>
</html>


{% endblock %}

{% block lower_buttons %}
{% endblock %}

{% block fact %}
{% endblock %}
